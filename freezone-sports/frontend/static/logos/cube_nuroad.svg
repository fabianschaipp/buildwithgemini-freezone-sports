<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="carbonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wheels (Gravel 40mm deep profile) -->
  <g stroke="#64748b" stroke-width="8" fill="none">
    <!-- Rear Wheel -->
    <circle cx="210" cy="330" r="130" stroke="#334155" stroke-width="16"/>
    <circle cx="210" cy="330" r="122" stroke="#1e293b" stroke-width="4"/>
    <circle cx="210" cy="330" r="20" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Front Wheel -->
    <circle cx="590" cy="330" r="130" stroke="#334155" stroke-width="16"/>
    <circle cx="590" cy="330" r="122" stroke="#1e293b" stroke-width="4"/>
    <circle cx="590" cy="330" r="20" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
  </g>

  <!-- Spokes subtle lattice -->
  <g stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.5">
    <line x1="210" y1="330" x2="130" y2="250"/>
    <line x1="210" y1="330" x2="290" y2="250"/>
    <line x1="210" y1="330" x2="130" y2="410"/>
    <line x1="210" y1="330" x2="290" y2="410"/>
    <line x1="590" y1="330" x2="510" y2="250"/>
    <line x1="590" y1="330" x2="670" y2="250"/>
    <line x1="590" y1="330" x2="510" y2="410"/>
    <line x1="590" y1="330" x2="670" y2="410"/>
  </g>

  <!-- Disc Rotors -->
  <circle cx="210" cy="330" r="42" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
  <circle cx="590" cy="330" r="42" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-dasharray="6 4"/>

  <!-- Cube Nuroad C:62 Carbon Frame (Red/Black) -->
  <!-- Chainstay & Seatstay -->
  <polyline points="210,330 380,330 350,200 210,330" stroke="url(#carbonRed)" stroke-width="14" stroke-linejoin="round" fill="none"/>
  
  <!-- Main Triangle: Bottom Bracket (380,330) -> Head Tube (530,170) -> Seat Tube (350,200) -->
  <!-- Downtube (Oversized Carbon) -->
  <line x1="380" y1="330" x2="530" y2="170" stroke="url(#carbonRed)" stroke-width="22" stroke-linecap="round"/>
  <!-- Toptube (Gravel Sloping) -->
  <line x1="350" y1="200" x2="530" y2="170" stroke="url(#carbonRed)" stroke-width="16" stroke-linecap="round"/>
  <!-- Seat Tube -->
  <line x1="380" y1="330" x2="340" y2="160" stroke="url(#carbonRed)" stroke-width="16" stroke-linecap="round"/>

  <!-- Carbon Fork -->
  <line x1="530" y1="170" x2="590" y2="330" stroke="url(#carbonRed)" stroke-width="16" stroke-linecap="round"/>

  <!-- Headtube & Gravel Flare Drop Handlebars -->
  <line x1="525" y1="180" x2="535" y2="150" stroke="#0f172a" stroke-width="16"/>
  <!-- Stem -->
  <line x1="535" y1="150" x2="560" y2="140" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Drop bar -->
  <path d="M 560,140 Q 590,140 585,175 Q 580,200 555,195" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>

  <!-- Seatpost & Saddle -->
  <line x1="350" y1="200" x2="335" y2="140" stroke="#0f172a" stroke-width="12"/>
  <!-- Sport Saddle -->
  <path d="M 305,138 C 320,132 360,135 375,142 C 360,146 320,145 305,138 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>

  <!-- Drivetrain (Crank & Chain) -->
  <circle cx="380" cy="330" r="26" fill="#1e293b" stroke="#f87171" stroke-width="4"/>
  <line x1="380" y1="330" x2="405" y2="365" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
  <rect x="395" y="365" width="20" height="8" rx="3" fill="#94a3b8"/>
  <polyline points="380,330 210,330" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="4 2" fill="none"/>

  <!-- Decal 'CUBE C:62' -->
  <text x="425" y="255" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" transform="rotate(-35, 425, 255)" letter-spacing="3">CUBE C:62</text>
</svg>